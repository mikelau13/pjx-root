apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjx-react-deployment
  labels:
    app: {{ .Values.web.appName }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.web.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.appName }}
    spec:
      containers:
      - name: {{ .Values.web.appName }}
        image: {{ include "pjx.image" (dict "root" $ "svc" .Values.web) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: pjx-react-service
spec:
  type: NodePort
  selector:
    app: {{ .Values.web.appName }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30100