apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjx-react-deployment
  labels:
    app: {{ .Values.web.appName }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.web.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.appName }}
    spec:
      containers:
      - name: {{ .Values.web.appName }}
        image: {{ include "pjx.image" (dict "root" $ "svc" .Values.web) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # react-scripts start exits with code 0 when stdin closes. Compose sets
        # stdin_open: true for the same reason; these are the Kubernetes spelling.
        stdin: true
        tty: true
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pjx-react-service
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.web.appName }}
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http  #adding name: http to each port lets the Ingress reference the port by name instead of number