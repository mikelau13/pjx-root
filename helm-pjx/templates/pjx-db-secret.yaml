# Connection strings carry the database password, so they live in a Secret,
# not in pjx-config. Locally the values come from environments/local.yaml.
# In Azure (Deployable Step 1b) the CSI driver syncs a Secret of this same
# name from Key Vault, so the pod specs below do not change between the two.
apiVersion: v1
kind: Secret
metadata:
    name: pjx-db
type: Opaque
stringData:
    dotnet-connection: {{ .Values.connectionStrings.dotnetApi | quote }}
    sso-connection:    {{ .Values.connectionStrings.sso | quote }}
