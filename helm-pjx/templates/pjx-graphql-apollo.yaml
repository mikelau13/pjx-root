apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjx-apollo-deployment
  labels:
    app: pjx-apollo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pjx-apollo
  template:
    metadata:
      labels:
        app: pjx-apollo
    spec:
      containers:
      - name: pjx-apollo
        image: {{ include "pjx.image" (dict "root" $ "svc" .Values.apollo) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
          # The image carries NODE_API_ENDPOINT=http://pjx-api-node:8081 from its
          # gitignored .env — a Compose service name that does not exist in k8s,
          # where the Service is pjx-node-service.
          - name: NODE_API_ENDPOINT
            value: http://pjx-node-service:8081/api/1
        ports:
        - containerPort: 4000
        readinessProbe:
          httpGet:
            path: /.well-known/apollo/server-health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /.well-known/apollo/server-health
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pjx-apollo-service
spec:
  type: ClusterIP
  selector:
    app: pjx-apollo
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
      name: http