apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjx-sso-deployment
  labels:
    app: pjx-sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pjx-sso
  template:
    metadata:
      labels:
        app: pjx-sso
    spec:
      containers:
      - name: pjx-sso
        image: {{ include "pjx.image" (dict "root" $ "svc" .Values.sso) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 5002
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
        env:
        - name: PJX_SSO__PASSWORD
          value: password
        - name: ASPNETCORE_Kestrel__Certificates__Default__Password
          value: password
        - name: PJX_SSO__CERTIFICATE
          value: pjx-sso-identityserver.rsa_2048.cert.pfx
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: https://+:443;http://+:80
        - name: ASPNETCORE_Kestrel__Certificates__Default__Path
          value: /app/pjx-sso-identityserver.rsa_2048.cert.pfx
        - name: PJX_CORS_ORIGINS
          value: https://{{ .Values.ingress.host }}
        - name: PJX_SSO__PUBLIC_ORIGIN
          value: https://sso.{{ .Values.ingress.host }}
---
apiVersion: v1
kind: Service
metadata:
  name: pjx-sso-service
spec:
  type: ClusterIP
  selector:
    app: pjx-sso
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http