name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            projects/pjx-web-react/package-lock.json
            projects/pjx-api-node/package-lock.json
            projects/pjx-graphql-apollo/package-lock.json
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      # validate.sh builds and tests; it does not install. A runner starts
      # with no node_modules, so react-scripts is missing and `tsc` falls
      # through to the runner's own global TypeScript.
      - name: Install Node dependencies
        run: |
          for p in pjx-web-react pjx-api-node pjx-graphql-apollo; do
            (cd "projects/$p" && npm ci)
          done
      - run: ./local/scripts/validate.sh build
      - run: ./local/scripts/validate.sh test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - pjx-web-react
          - pjx-graphql-apollo
          - pjx-api-node
          - pjx-api-dotnet
          - pjx-sso-identityserver
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=semver,pattern=v{{version}}
            type=ref,event=branch,prefix=dev-
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./projects/${{ matrix.service }}
          file: ./projects/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
