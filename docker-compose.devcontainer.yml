version: '3.8'

services:
  workspace:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/pjx-root:cached
      - /var/run/docker.sock:/var/run/docker-host.sock
    command: sleep infinity
    networks:
      - pjx-network

  pjx-graphql-apollo:
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=pjx-public"
      - "traefik.http.routers.pjx-ql.rule=Host(`ql.pjx.localhost`)"
      - "traefik.http.services.pjx-ql.loadbalancer.server.port=4000"  
    build:
      context: ./projects/pjx-graphql-apollo
      dockerfile: Dockerfile.dev
    container_name: pjx-graphql-apollo-dev
    volumes:
      - ${HOST_PROJECT_PATH:-.}/projects/pjx-graphql-apollo:/app:cached
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - pjx-network
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev

  pjx-api-dotnet:
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=pjx-public"
      - "traefik.http.routers.pjx-api.rule=Host(`api.pjx.localhost`)"
      - "traefik.http.services.pjx-api.loadbalancer.server.port=80"
    build:
      context: ./projects/pjx-api-dotnet
      dockerfile: Dockerfile.dev
    container_name: pjx-api-dotnet-dev
    volumes:
      - ${HOST_PROJECT_PATH:-.}/projects/pjx-api-dotnet:/app:cached
    ports:
      - "6001:80"
    networks:
      - pjx-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - PJX_SSO__AUTHORITY=https://pjx-sso-identityserver
    working_dir: /app/src/Pjx_Api
    command: ["dotnet", "watch", "run", "--urls", "http://0.0.0.0:80"]

  pjx-api-node:
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=pjx-public"
      - "traefik.http.routers.pjx-node.rule=Host(`node.pjx.localhost`)"
      - "traefik.http.services.pjx-node.loadbalancer.server.port=8081"
    build:
      context: ./projects/pjx-api-node
      dockerfile: Dockerfile.dev
    container_name: pjx-api-node-dev
    volumes:
      - ${HOST_PROJECT_PATH:-.}/projects/pjx-api-node:/app:cached
      - /app/node_modules
    ports:
      - "8081:8081"
    networks:
      - pjx-network
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm start

  pjx-web-react:
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=pjx-public"
      - "traefik.http.routers.pjx-web.rule=Host(`pjx.localhost`)"
      - "traefik.http.services.pjx-web.loadbalancer.server.port=3000"
    build:
      context: ./projects/pjx-web-react
      dockerfile: Dockerfile.dev
    container_name: pjx-web-react-dev
    volumes:
      - ${HOST_PROJECT_PATH:-.}/projects/pjx-web-react:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - pjx-network
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_HOST=pjx.localhost
      - WDS_SOCKET_PORT=80
    stdin_open: true
    tty: true
    command: npm start

  pjx-sso-identityserver:
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=pjx-public"
      - "traefik.http.routers.pjx-sso.rule=Host(`sso.pjx.localhost`)"
      - "traefik.http.services.pjx-sso.loadbalancer.server.port=80"
    build:
      context: ./projects/pjx-sso-identityserver
      dockerfile: Dockerfile.dev
    container_name: pjx-sso-identityserver-dev
    volumes:
      - ${HOST_PROJECT_PATH:-.}/projects/pjx-sso-identityserver:/app:cached
    ports:
      - "5001:80"
      - "5002:443"
    networks:
      - pjx-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/pjx-sso-identityserver.rsa_2048.cert.pfx
      - PJX_SSO__CERTIFICATE=pjx-sso-identityserver.rsa_2048.cert.pfx
      - PJX_SSO__PASSWORD=password

networks:
  pjx-network:
    driver: bridge
    name: pjx-network
